[build]
  base = "."
  command = "bun run build:web"
  publish = "packages/web/dist"

[build.environment]
  BUN_VERSION = "1.3.14"

[context.production]
  command = "bun run build:web"

[context.deploy-preview]
  command = "bun run build:web"

[context.branch-deploy]
  command = "bun run build:web"

# Preserve the legacy auto-insurance category while consolidating it
# into the new insurance hub.
[[redirects]]
  from = "/categoria/seguro-de-auto"
  to = "/categoria/seguros"
  status = 301
  force = true
