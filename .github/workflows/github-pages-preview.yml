# Preview deployment: GitHub Pages
name: GitHub Pages preview

on:
  push:
    branches:
      - github-pages-preview
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Normalize article body filenames for SSG
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import difflib
          import re

          root = Path("packages/web/src/web/content")
          body_dir = root / "bodies"
          article_files = list(root.glob("articles*.ts"))
          slugs = []
          for path in article_files:
              text = path.read_text(encoding="utf-8")
              slugs.extend(re.findall(r"slug:\s*[\"']([^\"']+)[\"']", text))

          existing = {p.stem for p in body_dir.glob("*.ts")}
          created = []
          for slug in sorted(set(slugs)):
              if slug in existing:
                  continue
              candidates = sorted(existing)
              if not candidates:
                  raise SystemExit("No hay archivos de cuerpo de artículos")
              best = max(candidates, key=lambda name: difflib.SequenceMatcher(None, slug, name).ratio())
              score = difflib.SequenceMatcher(None, slug, best).ratio()
              if score < 0.50:
                  raise SystemExit(f"No hay cuerpo suficientemente parecido para {slug} (mejor: {best}, {score:.2f})")
              target = body_dir / f"{slug}.ts"
              target.write_text(f'import body from "./{best}";\n\nexport default body;\n', encoding="utf-8")
              existing.add(slug)
              created.append((slug, best, score))

          for slug, best, score in created:
              print(f"[ssg-alias] {slug} -> {best} ({score:.2f})")
          print(f"[ssg-alias] {len(created)} aliases creados")
          PY

      - name: Build web
        run: bun run build:web
        env:
          GITHUB_PAGES: "true"

      - name: Make static asset paths portable
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("packages/web/dist")
          for path in root.rglob("*"):
              if path.suffix not in {".html", ".js", ".css"}:
                  continue
              text = path.read_text(encoding="utf-8")
              text = text.replace('"/images/', '"images/')
              text = text.replace("'/images/", "'images/")
              text = text.replace('url(/images/', 'url(images/')
              path.write_text(text, encoding="utf-8")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: packages/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
